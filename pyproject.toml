[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-financial-analyst"
version = "0.1.0"
description = "Production-grade agentic RAG system for financial document analysis"
requires-python = ">=3.9"
dependencies = [
    # Web
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # AI / LLM
    "langchain>=0.3.0",
    "langgraph>=0.2.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "openai>=1.50.0",
    "anthropic>=0.36.0",
    "tiktoken>=0.8.0",
    # Vector store
    "chromadb>=0.5.0",
    # Document ingestion
    "pypdf>=4.0.0",
    "pdfplumber>=0.11.0",
    # Data validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "black>=24.0.0",
    "mypy>=1.12.0",
    "types-pyyaml>=6.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["agents", "app", "configs", "evaluation", "ingestion", "llm", "rag", "tools"]

# --- Black ---
[tool.black]
line-length = 100
target-version = ["py312"]

# --- Ruff ---
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["agents", "app", "configs", "evaluation", "ingestion", "llm", "rag", "tools"]

# --- mypy ---
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

# --- pytest ---
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
